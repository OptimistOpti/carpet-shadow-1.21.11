name: Build

on:
  push:
    branches: [ "1.21.11" ]
  pull_request:
    branches: [ "1.21.11" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The wrapper jar/properties are not committed in this fork (see PORTING_NOTES.md),
      # so we install Gradle directly instead of relying on ./gradlew.
      # If you generate and commit a gradle/wrapper/gradle-wrapper.properties yourself,
      # you can switch this step + the build step below back to ./gradlew.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carpet-shadow-build
          path: |
            build/libs/*.jar
          if-no-files-found: warn
